<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spectrum — Emergence</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --amber: #D4940A;
    --amber-light: #F5DFA0;
    --teal: #0A8F7F;
    --teal-light: #A0E5D9;
    --bg: #0C0E13;
    --card: #13161D;
    --border: #2A2D36;
    --t1: #E8E6E1;
    --t2: #9A978F;
    --t3: #5C5A54;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .slide {
    width: 1280px;
    height: 720px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  /* Ambient glows */
  .slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 500px 350px at 25% 55%, rgba(212,148,10,0.07), transparent),
      radial-gradient(ellipse 500px 350px at 75% 55%, rgba(10,143,127,0.06), transparent);
    pointer-events: none;
    z-index: 0;
    animation: glowShift 8s ease-in-out infinite alternate;
  }
  @keyframes glowShift {
    0% { opacity: 0.8; }
    100% { opacity: 1; }
  }

  /* Floating particles */
  .particles {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    animation: float linear infinite;
    opacity: 0;
  }
  @keyframes float {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 0.5; }
    90% { opacity: 0.5; }
    100% { transform: translateY(-280px) translateX(30px); opacity: 0; }
  }

  /* ── Text content ── */
  .content {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 48px;
  }

  .eyebrow {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--t3);
    margin-bottom: 12px;
    animation: fadeIn 1s 0.3s ease both;
  }

  h1 {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 80px;
    line-height: 1.1;
    text-align: center;
    animation: fadeIn 1s 0.6s ease both;
  }
  h1 .line1 {
    display: block;
    color: var(--t1);
  }
  h1 .line2 {
    display: block;
    background: linear-gradient(90deg, var(--amber-light), var(--teal-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 26px;
    color: var(--t2);
    font-weight: 400;
    margin-top: 16px;
    letter-spacing: 0.04em;
    animation: fadeIn 1s 0.9s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── Spectrum bar area ── */
  .spectrum-area {
    position: absolute;
    left: 10%;
    right: 10%;
    top: 52%;
    height: 220px;
    z-index: 2;
    opacity: 0;
    animation: fadeIn 1.2s 1.2s ease both;
  }

  /* End labels */
  .end-label {
    position: absolute;
    top: 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--t3);
  }
  .end-label.left { left: 0; color: var(--amber); }
  .end-label.right { right: 0; color: var(--teal); }

  /* The bar track */
  .bar-track {
    position: absolute;
    top: 28px;
    left: 0;
    right: 0;
    height: 8px;
    background: var(--card);
    border-radius: 4px;
    border: 1px solid var(--border);
    overflow: visible;
  }

  /* Gradient fill */
  .bar-fill {
    position: absolute;
    inset: -1px;
    border-radius: 4px;
    background: linear-gradient(to right, var(--amber), #B89A3E, #6BA86B, var(--teal));
    opacity: 0;
    animation: barReveal 1.8s 1.6s ease-out forwards;
  }
  @keyframes barReveal {
    0% { clip-path: inset(0 100% 0 0); opacity: 1; }
    100% { clip-path: inset(0 0% 0 0); opacity: 1; }
  }

  /* Glow under bar */
  .bar-glow {
    position: absolute;
    top: 20px;
    left: 0;
    right: 0;
    height: 24px;
    background: linear-gradient(to right, rgba(212,148,10,0.15), rgba(10,143,127,0.15));
    filter: blur(12px);
    border-radius: 12px;
    opacity: 0;
    animation: barReveal 2s 1.8s ease-out forwards;
  }

  /* Scanning beam */
  .scan-beam {
    position: absolute;
    top: -6px;
    width: 60px;
    height: 20px;
    background: radial-gradient(ellipse, rgba(255,255,255,0.25), transparent);
    border-radius: 50%;
    opacity: 0;
    animation: scanBeam 5s 3.5s ease-in-out infinite;
  }
  @keyframes scanBeam {
    0% { left: -60px; opacity: 0; }
    5% { opacity: 1; }
    95% { opacity: 1; }
    100% { left: calc(100% + 60px); opacity: 0; }
  }

  /* Tick marks */
  .ticks {
    position: absolute;
    top: 20px;
    left: 0;
    right: 0;
    height: 24px;
  }
  .tick {
    position: absolute;
    top: 0;
    width: 1px;
    height: 24px;
    background: var(--t3);
    opacity: 0;
    transform-origin: top;
  }
  .tick::after {
    content: '';
    position: absolute;
    top: 0;
    left: -3px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: inherit;
    opacity: 0.6;
  }
  .tick:nth-child(1) { left: 0%; background: var(--amber); animation: tickIn 0.5s 2.0s ease-out forwards; }
  .tick:nth-child(2) { left: 25%; background: #C9A030; animation: tickIn 0.5s 2.2s ease-out forwards; }
  .tick:nth-child(3) { left: 50%; background: #8DAA5A; animation: tickIn 0.5s 2.4s ease-out forwards; }
  .tick:nth-child(4) { left: 75%; background: #3DAF8E; animation: tickIn 0.5s 2.6s ease-out forwards; }
  .tick:nth-child(5) { left: 100%; background: var(--teal); animation: tickIn 0.5s 2.8s ease-out forwards; }
  @keyframes tickIn {
    from { opacity: 0; transform: scaleY(0); }
    to { opacity: 0.4; transform: scaleY(1); }
  }

  /* Tool labels */
  .tool-labels {
    position: absolute;
    top: 52px;
    left: 0;
    right: 0;
  }
  .tool-label {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: translateX(-50%);
    opacity: 0;
  }
  .tool-label .name {
    font-size: 13px;
    font-weight: 600;
    color: var(--t1);
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .tool-label .desc {
    font-size: 10px;
    color: var(--t3);
    margin-top: 2px;
    white-space: nowrap;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .tool-label .connector {
    width: 1px;
    height: 12px;
    margin-bottom: 4px;
  }

  .tool-label:nth-child(1) { left: 5%; }
  .tool-label:nth-child(1) .connector { background: var(--amber); }
  .tool-label:nth-child(1) .name { color: var(--amber-light); }
  .tool-label:nth-child(1) { animation: labelIn 0.6s 3.0s ease-out forwards; }

  .tool-label:nth-child(2) { left: 28%; }
  .tool-label:nth-child(2) .connector { background: #C9A030; }
  .tool-label:nth-child(2) .name { color: #E8D080; }
  .tool-label:nth-child(2) { animation: labelIn 0.6s 3.3s ease-out forwards; }

  .tool-label:nth-child(3) { left: 52%; }
  .tool-label:nth-child(3) .connector { background: #8DAA5A; }
  .tool-label:nth-child(3) .name { color: #B8D88A; }
  .tool-label:nth-child(3) { animation: labelIn 0.6s 3.6s ease-out forwards; }

  .tool-label:nth-child(4) { left: 78%; }
  .tool-label:nth-child(4) .connector { background: #3DAF8E; }
  .tool-label:nth-child(4) .name { color: var(--teal-light); }
  .tool-label:nth-child(4) { animation: labelIn 0.6s 3.9s ease-out forwards; }

  .tool-label:nth-child(5) { left: 96%; }
  .tool-label:nth-child(5) .connector { background: var(--teal); }
  .tool-label:nth-child(5) .name { color: var(--teal-light); }
  .tool-label:nth-child(5) { animation: labelIn 0.6s 4.2s ease-out forwards; }

  @keyframes labelIn {
    from { opacity: 0; transform: translateX(-50%) translateY(8px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* Progress marker */
  .marker {
    position: absolute;
    top: 16px;
    z-index: 5;
    transform: translateX(-50%);
    opacity: 0;
    animation: markerIn 0.8s 2.8s ease-out forwards;
  }
  .marker-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--amber);
    border: 3px solid var(--bg);
    box-shadow: 0 0 12px rgba(212,148,10,0.5), 0 0 24px rgba(212,148,10,0.2);
    animation: markerPulse 2s 3.5s ease-in-out infinite;
  }
  .marker-ring {
    position: absolute;
    top: -6px;
    left: -6px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--amber);
    opacity: 0;
    animation: ringPulse 2s 3.5s ease-out infinite;
  }
  .marker-label {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--amber-light);
    white-space: nowrap;
    text-shadow: 0 0 8px rgba(212,148,10,0.4);
  }
  @keyframes markerIn {
    from { opacity: 0; transform: translateX(-50%) scale(0); }
    to { opacity: 1; transform: translateX(-50%) scale(1); }
  }
  @keyframes markerPulse {
    0%, 100% { box-shadow: 0 0 12px rgba(212,148,10,0.5), 0 0 24px rgba(212,148,10,0.2); }
    50% { box-shadow: 0 0 20px rgba(212,148,10,0.7), 0 0 40px rgba(212,148,10,0.3); }
  }
  @keyframes ringPulse {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(2.2); opacity: 0; }
  }

  /* SVG spectrum visualization */
  .spectrum-viz {
    position: absolute;
    top: 110px;
    left: 0;
    right: 0;
    height: 100px;
    pointer-events: none;
  }

  /* Bottom bar */
  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 4;
    padding: 10px 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(10,12,16,0.9);
    border-top: 1px solid var(--border);
  }
  .bottom-bar span {
    font-size: 18px;
    color: var(--t3);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* Noise grain overlay */
  .grain {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    opacity: 0.03;
    mix-blend-mode: overlay;
  }
</style>
</head>
<body>
<div class="slide">

  <!-- Floating particles -->
  <div class="particles">
    <div class="particle" style="left:8%; bottom:200px; width:3px; height:3px; background:#D4940A; animation-duration:7s; animation-delay:0s;"></div>
    <div class="particle" style="left:20%; bottom:180px; width:2px; height:2px; background:#0A8F7F; animation-duration:9s; animation-delay:1.2s;"></div>
    <div class="particle" style="left:35%; bottom:220px; width:2.5px; height:2.5px; background:#A0E5D9; animation-duration:8s; animation-delay:2.5s;"></div>
    <div class="particle" style="left:50%; bottom:190px; width:2px; height:2px; background:#F5DFA0; animation-duration:10s; animation-delay:0.8s;"></div>
    <div class="particle" style="left:65%; bottom:210px; width:3px; height:3px; background:#3DC4B0; animation-duration:7.5s; animation-delay:3.2s;"></div>
    <div class="particle" style="left:80%; bottom:200px; width:2px; height:2px; background:#D4940A; animation-duration:8.5s; animation-delay:1.8s;"></div>
    <div class="particle" style="left:92%; bottom:230px; width:2px; height:2px; background:#0A8F7F; animation-duration:9.5s; animation-delay:4s;"></div>
    <div class="particle" style="left:15%; bottom:240px; width:2.5px; height:2.5px; background:#F5DFA0; animation-duration:7s; animation-delay:2s;"></div>
    <div class="particle" style="left:45%; bottom:170px; width:2px; height:2px; background:#A0E5D9; animation-duration:8s; animation-delay:3.5s;"></div>
    <div class="particle" style="left:72%; bottom:250px; width:3px; height:3px; background:#D4940A; animation-duration:6.5s; animation-delay:0.5s;"></div>
  </div>

  <!-- Text content -->
  <div class="content">
    <div class="eyebrow">Section 1 of 3</div>
    <h1>
      <span class="line1">The Randomness</span>
      <span class="line2">Spectrum</span>
    </h1>
    <div class="subtitle">Every AI tool sits somewhere on this line</div>
  </div>

  <!-- Spectrum bar area -->
  <div class="spectrum-area">
    <!-- End labels -->
    <div class="end-label left">HIGH RANDOMNESS</div>
    <div class="end-label right">ZERO RANDOMNESS</div>

    <!-- Bar track -->
    <div class="bar-track">
      <div class="bar-fill"></div>
      <div class="scan-beam"></div>
    </div>

    <!-- Glow under bar -->
    <div class="bar-glow"></div>

    <!-- Tick marks -->
    <div class="ticks">
      <div class="tick"></div>
      <div class="tick"></div>
      <div class="tick"></div>
      <div class="tick"></div>
      <div class="tick"></div>
    </div>

    <!-- Progress marker at 14% -->
    <div class="marker" style="left: 14%;">
      <div class="marker-label">YOU ARE HERE</div>
      <div class="marker-ring"></div>
      <div class="marker-dot"></div>
    </div>

    <!-- Tool labels along the spectrum -->
    <div class="tool-labels">
      <div class="tool-label">
        <div class="connector"></div>
        <div class="name">NotebookLM</div>
        <div class="desc">Audio / Summary</div>
      </div>
      <div class="tool-label">
        <div class="connector"></div>
        <div class="name">DALL-E</div>
        <div class="desc">Image Gen</div>
      </div>
      <div class="tool-label">
        <div class="connector"></div>
        <div class="name">Google AI Studio</div>
        <div class="desc">Text + Vision</div>
      </div>
      <div class="tool-label">
        <div class="connector"></div>
        <div class="name">Figma AI</div>
        <div class="desc">Design</div>
      </div>
      <div class="tool-label">
        <div class="connector"></div>
        <div class="name">Claude Code</div>
        <div class="desc">Deterministic</div>
      </div>
    </div>

    <!-- SVG waveform visualization -->
    <svg class="spectrum-viz" viewBox="0 0 1024 100" preserveAspectRatio="none">
      <defs>
        <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#D4940A" stop-opacity="0.15"/>
          <stop offset="50%" stop-color="#8DAA5A" stop-opacity="0.1"/>
          <stop offset="100%" stop-color="#0A8F7F" stop-opacity="0.15"/>
        </linearGradient>
      </defs>
      <!-- Chaotic wave on left, smooth on right -->
      <path id="wave1" fill="none" stroke="url(#waveGrad)" stroke-width="1.5" opacity="0">
        <animate attributeName="opacity" values="0;0.8" dur="1.5s" begin="2s" fill="freeze"/>
      </path>
      <path id="wave2" fill="none" stroke="url(#waveGrad)" stroke-width="1" opacity="0">
        <animate attributeName="opacity" values="0;0.5" dur="1.5s" begin="2.3s" fill="freeze"/>
      </path>
    </svg>
  </div>

  <!-- Noise grain overlay -->
  <svg class="grain" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <filter id="grainFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch">
        <animate attributeName="baseFrequency" values="0.8;0.85;0.8" dur="6s" repeatCount="indefinite"/>
      </feTurbulence>
    </filter>
    <rect width="100%" height="100%" filter="url(#grainFilter)"/>
  </svg>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <span>Nathan A. Gaffney, Partner</span>
    <span>Fried Goldberg, LLC</span>
  </div>
</div>

<script>
(function() {
  // Generate animated waveforms — chaotic on left, smooth on right
  function buildWave(yCenter, amplitude, noiseScale, phaseOffset) {
    var points = [];
    var steps = 128;
    for (var i = 0; i <= steps; i++) {
      var t = i / steps;
      var x = t * 1024;
      // Noise decreases left to right (mirroring randomness → deterministic)
      var chaos = Math.max(0, 1 - t * 1.3);
      var wave = Math.sin(t * Math.PI * 6 + phaseOffset) * amplitude * (0.3 + chaos * 0.7);
      // Add high-frequency noise on left side
      var noise = chaos * noiseScale * (Math.sin(t * 47 + phaseOffset) + Math.sin(t * 73 + phaseOffset * 1.3) * 0.5);
      var y = yCenter + wave + noise;
      points.push((i === 0 ? 'M' : 'L') + ' ' + x.toFixed(1) + ' ' + y.toFixed(1));
    }
    return points.join(' ');
  }

  var wave1Path = buildWave(50, 18, 12, 0);
  var wave1Path2 = buildWave(50, 18, 12, 0.5);
  var wave2Path = buildWave(50, 14, 8, 2);
  var wave2Path2 = buildWave(50, 14, 8, 2.5);

  var w1 = document.getElementById('wave1');
  var w2 = document.getElementById('wave2');
  w1.setAttribute('d', wave1Path);
  w2.setAttribute('d', wave2Path);

  // Animate waves
  var animW1 = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
  animW1.setAttribute('attributeName', 'd');
  animW1.setAttribute('values', wave1Path + ';' + wave1Path2 + ';' + wave1Path);
  animW1.setAttribute('dur', '4s');
  animW1.setAttribute('repeatCount', 'indefinite');
  w1.appendChild(animW1);

  var animW2 = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
  animW2.setAttribute('attributeName', 'd');
  animW2.setAttribute('values', wave2Path + ';' + wave2Path2 + ';' + wave2Path);
  animW2.setAttribute('dur', '5s');
  animW2.setAttribute('repeatCount', 'indefinite');
  w2.appendChild(animW2);
})();
</script>
</body>
</html>
