<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATAA 2026 Welcome — Full Color Logo</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --amber: #D4940A;
    --amber-light: #F5DFA0;
    --teal: #0A8F7F;
    --teal-light: #A0E5D9;
    --bg: #0C0E13;
    --card: #13161D;
    --border: #2A2D36;
    --t1: #E8E6E1;
    --t2: #9A978F;
    --t3: #5C5A54;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .slide {
    width: 1280px;
    height: 720px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  /* Ambient glows */
  .slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 600px 400px at 50% 85%, rgba(212,148,10,0.06), transparent),
      radial-gradient(ellipse 500px 400px at 70% 30%, rgba(10,143,127,0.05), transparent);
    pointer-events: none;
    z-index: 0;
  }

  /* Road surface */
  .road {
    position: absolute;
    bottom: 80px;
    left: 0;
    right: 0;
    height: 64px;
    background: #15181F;
    border-top: 2px solid #2A2D36;
    border-bottom: 2px solid #2A2D36;
    z-index: 1;
  }
  .road::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 3px;
    transform: translateY(-50%);
    background: repeating-linear-gradient(
      to right,
      #D4940A44 0px, #D4940A44 30px,
      transparent 30px, transparent 60px
    );
    animation: roadScroll 1.5s linear infinite;
  }
  @keyframes roadScroll {
    from { transform: translateY(-50%) translateX(0); }
    to { transform: translateY(-50%) translateX(-60px); }
  }

  /* Ground line */
  .ground {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 80px;
    background: linear-gradient(to top, #0A0C10, #0F1118);
    z-index: 0;
  }

  /* TRUCK SVG */
  .truck-container {
    position: absolute;
    bottom: 88px;
    z-index: 2;
    animation: truckDrive 12s linear infinite;
  }
  @keyframes truckDrive {
    0% { left: -500px; }
    100% { left: 1400px; }
  }

  /* Slight bounce */
  .truck-bounce {
    animation: bounce 0.4s ease-in-out infinite alternate;
  }
  @keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-2px); }
  }

  /* TEXT */
  .content {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 40px;
  }

  .eyebrow {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--t3);
    margin-bottom: 16px;
    animation: fadeIn 1s 0.3s ease both;
  }

  h1 {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 96px;
    line-height: 1.15;
    text-align: center;
    max-width: 900px;
    animation: fadeIn 1s 0.6s ease both;
  }
  h1 .line1 {
    display: block;
    color: var(--t1);
  }
  h1 .line2 {
    display: block;
    background: linear-gradient(90deg, var(--amber-light), var(--teal-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 34px;
    color: var(--t2);
    font-weight: 400;
    margin-top: 24px;
    letter-spacing: 0.04em;
    animation: fadeIn 1s 0.9s ease both;
  }

  .event-badge {
    margin-top: 28px;
    padding: 10px 28px;
    border: 1px solid var(--border);
    border-radius: 40px;
    background: var(--card);
    display: flex;
    align-items: center;
    gap: 14px;
    animation: fadeIn 1s 1.2s ease both;
  }
  .event-badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--teal);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(10,143,127,0.4); }
    50% { opacity: 0.7; box-shadow: 0 0 0 8px rgba(10,143,127,0); }
  }
  .event-badge span {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--t2);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Floating particles */
  .particles {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    animation: float linear infinite;
    opacity: 0;
  }
  @keyframes float {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 0.4; }
    90% { opacity: 0.4; }
    100% { transform: translateY(-300px) translateX(40px); opacity: 0; }
  }

  /* Headlight glow on truck */
  .headlight-glow {
    position: absolute;
    bottom: 100px;
    width: 200px;
    height: 60px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(245,223,160,0.08), transparent);
    z-index: 1;
    animation: truckDrive 12s linear infinite;
    pointer-events: none;
  }

  /* Bottom bar */
  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 4;
    padding: 10px 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(10,12,16,0.9);
    border-top: 1px solid var(--border);
  }
  .bottom-bar span {
    font-size: 18px;
    color: var(--t3);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
</style>
</head>
