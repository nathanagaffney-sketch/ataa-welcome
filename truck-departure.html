<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATAA 2026 — Closing</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --amber: #D4940A;
    --amber-light: #F5DFA0;
    --teal: #0A8F7F;
    --teal-light: #A0E5D9;
    --bg: #0C0E13;
    --card: #13161D;
    --border: #2A2D36;
    --t1: #E8E6E1;
    --t2: #9A978F;
    --t3: #5C5A54;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .slide {
    width: 1280px;
    height: 720px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  /* Sunset gradient — warm amber fading up */
  .slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 900px 300px at 50% 80%, rgba(212,148,10,0.10), transparent),
      radial-gradient(ellipse 600px 500px at 30% 90%, rgba(180,100,20,0.06), transparent),
      radial-gradient(ellipse 400px 300px at 70% 30%, rgba(10,143,127,0.04), transparent),
      linear-gradient(to top, rgba(212,148,10,0.04), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* Road surface */
  .road {
    position: absolute;
    bottom: 80px;
    left: 0;
    right: 0;
    height: 64px;
    background: #15181F;
    border-top: 2px solid #2A2D36;
    border-bottom: 2px solid #2A2D36;
    z-index: 1;
  }
  .road::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 3px;
    transform: translateY(-50%);
    background: repeating-linear-gradient(
      to right,
      #D4940A44 0px, #D4940A44 30px,
      transparent 30px, transparent 60px
    );
    animation: roadScroll 1.5s linear infinite reverse;
  }
  @keyframes roadScroll {
    from { transform: translateY(-50%) translateX(0); }
    to { transform: translateY(-50%) translateX(-60px); }
  }

  /* Ground */
  .ground {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 80px;
    background: linear-gradient(to top, #0A0C10, #0F1118);
    z-index: 0;
  }

  /* Truck — starts right, drives left and shrinks (perspective) */
  .truck-container {
    position: absolute;
    bottom: 88px;
    z-index: 2;
    transform: scaleX(-1); /* Mirror — truck faces left */
    animation: truckDepart 10s ease-in forwards;
  }
  @keyframes truckDepart {
    0%   { left: 400px; opacity: 1; transform: scaleX(-1) scale(1); }
    60%  { left: -200px; opacity: 0.8; transform: scaleX(-1) scale(0.85); }
    100% { left: -700px; opacity: 0; transform: scaleX(-1) scale(0.6); }
  }

  .truck-bounce {
    animation: bounce 0.4s ease-in-out infinite alternate;
  }
  @keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-2px); }
  }

  /* Text — fades in after truck passes */
  .content {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 144px;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 0;
    animation: textReveal 1.5s 5s ease-out forwards;
  }
  @keyframes textReveal {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .thank-you {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 80px;
    color: var(--t1);
    margin-bottom: 12px;
  }

  .closing-sub {
    font-size: 28px;
    color: var(--t2);
    letter-spacing: 0.04em;
    margin-bottom: 24px;
  }

  .contact {
    font-size: 20px;
    color: var(--t3);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  /* Trail particles — left behind by truck */
  .trail-particles {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  .trail {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    animation: trailFade 3s ease-out forwards;
  }
  @keyframes trailFade {
    0%   { opacity: 0.5; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-80px) scale(0.3); }
  }

  /* Floating particles (ambient) */
  .particles {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    animation: float linear infinite;
    opacity: 0;
  }
  @keyframes float {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: 0.4; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(-300px) translateX(40px); opacity: 0; }
  }

  /* Headlight glow — follows truck */
  .headlight-glow {
    position: absolute;
    bottom: 100px;
    width: 200px;
    height: 60px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(245,223,160,0.08), transparent);
    z-index: 1;
    pointer-events: none;
    transform: scaleX(-1);
    animation: truckDepart 10s ease-in forwards;
  }

  /* Bottom bar */
  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 4;
    padding: 10px 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(10,12,16,0.9);
    border-top: 1px solid var(--border);
  }
  .bottom-bar span {
    font-size: 18px;
    color: var(--t3);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="slide">

  <!-- Ambient particles -->
  <div class="particles">
    <div class="particle" style="left:10%; bottom:140px; width:3px; height:3px; background:#D4940A; animation-duration:6s; animation-delay:0s;"></div>
    <div class="particle" style="left:25%; bottom:100px; width:2px; height:2px; background:#0A8F7F; animation-duration:8s; animation-delay:1s;"></div>
    <div class="particle" style="left:45%; bottom:120px; width:2.5px; height:2.5px; background:#A0E5D9; animation-duration:7s; animation-delay:2s;"></div>
    <div class="particle" style="left:65%; bottom:130px; width:2px; height:2px; background:#F5DFA0; animation-duration:9s; animation-delay:0.5s;"></div>
    <div class="particle" style="left:80%; bottom:110px; width:3px; height:3px; background:#3DC4B0; animation-duration:6.5s; animation-delay:3s;"></div>
    <div class="particle" style="left:35%; bottom:100px; width:2px; height:2px; background:#0A8F7F; animation-duration:8.5s; animation-delay:4s;"></div>
  </div>

  <!-- Trail particles (stagger delay to simulate trail from truck path) -->
  <div class="trail-particles" id="trails"></div>

  <!-- Text content — appears after truck departs -->
  <div class="content">
    <div class="thank-you">Thank You</div>
    <div class="closing-sub">Nathan A. Gaffney, Partner</div>
    <div class="contact">ngaffney@friedgoldberg.com</div>
  </div>

  <!-- Road -->
  <div class="road"></div>
  <div class="ground"></div>

  <!-- Headlight glow -->
  <div class="headlight-glow" style="margin-left: -40px;"></div>

  <!-- TRUCK (mirrored — faces left, drives away) -->
  <div class="truck-container">
    <div class="truck-bounce">
      <svg width="420" height="120" viewBox="0 0 420 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- TRAILER -->
        <rect x="0" y="14" width="260" height="80" rx="4" fill="#13161D" stroke="#D4940A" stroke-width="1.5"/>
        <line x1="50" y1="18" x2="50" y2="90" stroke="#D4940A" stroke-width="0.5" opacity="0.2"/>
        <line x1="100" y1="18" x2="100" y2="90" stroke="#D4940A" stroke-width="0.5" opacity="0.2"/>
        <line x1="150" y1="18" x2="150" y2="90" stroke="#D4940A" stroke-width="0.5" opacity="0.2"/>
        <line x1="200" y1="18" x2="200" y2="90" stroke="#D4940A" stroke-width="0.5" opacity="0.2"/>
        <!-- ATAA Logo backdrop -->
        <circle cx="130" cy="54" r="38" fill="#0C0E13" opacity="0.95"/>
        <circle cx="130" cy="54" r="38" fill="none" stroke="#D4940A" stroke-width="1.2" opacity="0.5">
          <animate attributeName="opacity" values="0.5;0.3;0.5" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="130" cy="54" r="40.5" fill="none" stroke="#D4940A" stroke-width="0.4" opacity="0.2">
          <animate attributeName="opacity" values="0.2;0.08;0.2" dur="3s" repeatCount="indefinite"/>
          <animate attributeName="r" values="40.5;42;40.5" dur="3s" repeatCount="indefinite"/>
        </circle>
        <!-- ATAA text simplified -->
        <text x="130" y="60" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="20" font-weight="700" fill="#F5DFA0" opacity="0.9">ATAA</text>
        <!-- Trailer undercarriage -->
        <rect x="10" y="94" width="240" height="6" rx="2" fill="#0C0E13" stroke="#2A2D36" stroke-width="0.8"/>
        <!-- Rear lights (now leading since mirrored) -->
        <rect x="2" y="76" width="4" height="12" rx="1" fill="#E53E3E" opacity="0.7"/>
        <rect x="2" y="30" width="4" height="8" rx="1" fill="#D4940A" opacity="0.4"/>
        <!-- Trailer wheels -->
        <circle cx="50" cy="104" r="14" fill="#0C0E13" stroke="#2A2D36" stroke-width="2"/>
        <circle cx="50" cy="104" r="8" fill="#13161D" stroke="#D4940A" stroke-width="1" opacity="0.5"/>
        <circle cx="50" cy="104" r="3" fill="#D4940A" opacity="0.3"/>
        <circle cx="90" cy="104" r="14" fill="#0C0E13" stroke="#2A2D36" stroke-width="2"/>
        <circle cx="90" cy="104" r="8" fill="#13161D" stroke="#D4940A" stroke-width="1" opacity="0.5"/>
        <circle cx="90" cy="104" r="3" fill="#D4940A" opacity="0.3"/>
        <g style="animation: spinCW 0.5s linear infinite; transform-origin: 50px 104px;">
          <line x1="50" y1="96" x2="50" y2="112" stroke="#D4940A" stroke-width="0.5" opacity="0.3"/>
          <line x1="42" y1="104" x2="58" y2="104" stroke="#D4940A" stroke-width="0.5" opacity="0.3"/>
        </g>
        <g style="animation: spinCW 0.5s linear infinite; transform-origin: 90px 104px;">
          <line x1="90" y1="96" x2="90" y2="112" stroke="#D4940A" stroke-width="0.5" opacity="0.3"/>
          <line x1="82" y1="104" x2="98" y2="104" stroke="#D4940A" stroke-width="0.5" opacity="0.3"/>
        </g>

        <!-- COUPLING -->
        <rect x="255" y="86" width="20" height="8" rx="2" fill="#1A1E27" stroke="#2A2D36" stroke-width="1"/>

        <!-- CAB -->
        <rect x="272" y="28" width="100" height="66" rx="5" fill="#13161D" stroke="#0A8F7F" stroke-width="1.5"/>
        <rect x="365" y="48" width="40" height="46" rx="4" fill="#13161D" stroke="#0A8F7F" stroke-width="1.5"/>
        <line x1="370" y1="56" x2="400" y2="56" stroke="#0A8F7F" stroke-width="0.5" opacity="0.3"/>
        <line x1="370" y1="64" x2="400" y2="64" stroke="#0A8F7F" stroke-width="0.5" opacity="0.3"/>
        <path d="M 365 48 L 395 38 L 405 38 L 405 48" fill="#13161D" stroke="#0A8F7F" stroke-width="1.2"/>
        <rect x="354" y="32" width="18" height="34" rx="3" fill="#0A8F7F" opacity="0.12" stroke="#A0E5D9" stroke-width="1"/>
        <line x1="358" y1="34" x2="362" y2="62" stroke="#A0E5D9" stroke-width="1" opacity="0.2"/>
        <rect x="310" y="34" width="38" height="24" rx="3" fill="#0A8F7F" opacity="0.08" stroke="#0A8F7F" stroke-width="0.8"/>
        <rect x="280" y="20" width="80" height="10" rx="4" fill="#13161D" stroke="#0A8F7F" stroke-width="1"/>
        <!-- Roof lights -->
        <circle cx="296" cy="18" r="3" fill="#D4940A" opacity="0.6">
          <animate attributeName="opacity" values="0.6;0.3;0.6" dur="1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="310" cy="18" r="3" fill="#D4940A" opacity="0.6">
          <animate attributeName="opacity" values="0.6;0.3;0.6" dur="1s" repeatCount="indefinite" begin="0.15s"/>
        </circle>
        <circle cx="324" cy="18" r="3" fill="#D4940A" opacity="0.6">
          <animate attributeName="opacity" values="0.6;0.3;0.6" dur="1s" repeatCount="indefinite" begin="0.3s"/>
        </circle>
        <circle cx="338" cy="18" r="3" fill="#D4940A" opacity="0.6">
          <animate attributeName="opacity" values="0.6;0.3;0.6" dur="1s" repeatCount="indefinite" begin="0.45s"/>
        </circle>
        <circle cx="352" cy="18" r="3" fill="#D4940A" opacity="0.6">
          <animate attributeName="opacity" values="0.6;0.3;0.6" dur="1s" repeatCount="indefinite" begin="0.6s"/>
        </circle>
        <!-- Exhaust -->
        <rect x="278" y="4" width="6" height="20" rx="2" fill="#1A1E27" stroke="#2A2D36" stroke-width="1"/>
        <circle cx="281" cy="0" r="4" fill="#2A2D36" opacity="0.3">
          <animate attributeName="cy" values="0;-12" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="r" values="4;8" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.3;0" dur="2s" repeatCount="indefinite"/>
        </circle>
        <!-- Headlights -->
        <rect x="402" y="50" width="6" height="10" rx="2" fill="#F5DFA0" opacity="0.8">
          <animate attributeName="opacity" values="0.8;0.5;0.8" dur="2s" repeatCount="indefinite"/>
        </rect>
        <rect x="402" y="66" width="6" height="6" rx="2" fill="#D4940A" opacity="0.5"/>
        <path d="M 408 55 L 440 40 L 440 80 L 408 65 Z" fill="url(#beam)" opacity="0.06"/>
        <!-- Bumper -->
        <rect x="400" y="84" width="12" height="10" rx="2" fill="#1A1E27" stroke="#2A2D36" stroke-width="1"/>
        <rect x="300" y="72" width="30" height="20" rx="4" fill="#0C0E13" stroke="#2A2D36" stroke-width="1"/>
        <rect x="348" y="80" width="14" height="4" rx="1" fill="#1A1E27" stroke="#0A8F7F" stroke-width="0.6" opacity="0.5"/>
        <rect x="348" y="88" width="14" height="4" rx="1" fill="#1A1E27" stroke="#0A8F7F" stroke-width="0.6" opacity="0.4"/>
        <!-- Drive wheels -->
        <circle cx="310" cy="104" r="14" fill="#0C0E13" stroke="#2A2D36" stroke-width="2"/>
        <circle cx="310" cy="104" r="8" fill="#13161D" stroke="#0A8F7F" stroke-width="1" opacity="0.5"/>
        <circle cx="310" cy="104" r="3" fill="#0A8F7F" opacity="0.3"/>
        <circle cx="388" cy="104" r="14" fill="#0C0E13" stroke="#2A2D36" stroke-width="2"/>
        <circle cx="388" cy="104" r="8" fill="#13161D" stroke="#0A8F7F" stroke-width="1" opacity="0.5"/>
        <circle cx="388" cy="104" r="3" fill="#0A8F7F" opacity="0.3"/>
        <g style="animation: spinCW 0.5s linear infinite; transform-origin: 310px 104px;">
          <line x1="310" y1="96" x2="310" y2="112" stroke="#0A8F7F" stroke-width="0.5" opacity="0.3"/>
          <line x1="302" y1="104" x2="318" y2="104" stroke="#0A8F7F" stroke-width="0.5" opacity="0.3"/>
        </g>
        <g style="animation: spinCW 0.5s linear infinite; transform-origin: 388px 104px;">
          <line x1="388" y1="96" x2="388" y2="112" stroke="#0A8F7F" stroke-width="0.5" opacity="0.3"/>
          <line x1="380" y1="104" x2="396" y2="104" stroke="#0A8F7F" stroke-width="0.5" opacity="0.3"/>
        </g>
        <rect x="352" y="30" width="4" height="8" rx="1" fill="#1A1E27" stroke="#0A8F7F" stroke-width="0.6"/>
        <line x1="354" y1="30" x2="354" y2="24" stroke="#0A8F7F" stroke-width="0.6"/>

        <defs>
          <linearGradient id="beam" x1="408" y1="55" x2="440" y2="55">
            <stop offset="0%" stop-color="#F5DFA0" stop-opacity="1"/>
            <stop offset="100%" stop-color="#F5DFA0" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <style>
          @keyframes spinCW { to { transform: rotate(360deg); } }
        </style>
      </svg>
    </div>
  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <span>Nathan A. Gaffney, Partner</span>
    <span>Fried Goldberg, LLC</span>
  </div>
</div>

<script>
// Generate trail particles along the truck's path
const trailContainer = document.getElementById('trails');
const colors = ['#D4940A', '#F5DFA0', '#0A8F7F', '#A0E5D9'];
for (let i = 0; i < 20; i++) {
  const dot = document.createElement('div');
  dot.className = 'trail';
  const x = 800 - i * 55; // spread along the truck's path
  const y = 580 + Math.random() * 30;
  const size = 2 + Math.random() * 3;
  const delay = 1 + i * 0.4;
  const color = colors[i % colors.length];
  dot.style.cssText = `left:${x}px; top:${y}px; width:${size}px; height:${size}px; background:${color}; animation-delay:${delay}s;`;
  trailContainer.appendChild(dot);
}
</script>
</body>
</html>
