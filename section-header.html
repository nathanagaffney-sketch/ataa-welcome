<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Section Header — Emergence</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .slide {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #1a1a2e;
  }

  /* ── Fractal noise layer ── */
  .noise-layer {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  /* ── Pulsing glow layer ── */
  .glow-layer {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  /* ── Rule line layer ── */
  .rule-layer {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
  }

  /* ── Text content ── */
  .content {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-left: 8%;
    padding-right: 8%;
  }

  .section-label {
    font-family: Calibri, 'Segoe UI', system-ui, sans-serif;
    font-size: clamp(12px, 1.4vw, 18px);
    font-weight: 400;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #8faa6b;
    margin-bottom: 1.2vh;
    opacity: 0;
    animation: fadeSlideUp 0.8s 0.3s ease-out forwards;
  }

  .title {
    font-family: Candara, 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
    font-size: clamp(36px, 5.5vw, 72px);
    font-weight: 700;
    color: #f0ece2;
    line-height: 1.15;
    margin-bottom: 1.5vh;
    opacity: 0;
    animation: fadeSlideUp 0.9s 0.6s ease-out forwards;
  }

  .subtitle {
    font-family: Calibri, 'Segoe UI', system-ui, sans-serif;
    font-size: clamp(16px, 2.2vw, 28px);
    font-weight: 400;
    color: #d4a574;
    line-height: 1.4;
    opacity: 0;
    animation: fadeSlideUp 0.8s 0.9s ease-out forwards;
  }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes glowPulse {
    0%, 100% { opacity: var(--glow-lo); }
    50%      { opacity: var(--glow-hi); }
  }
</style>
</head>
<body>
<div class="slide" id="slide">
  <!-- Noise: SVG with animated feTurbulence -->
  <svg class="noise-layer" id="noiseLayer" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" stitchTiles="stitch" result="noise">
        <animate attributeName="baseFrequency" values="0.65;0.68;0.65" dur="8s" repeatCount="indefinite"/>
      </feTurbulence>
    </filter>
    <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
  </svg>

  <!-- Glow: radial gradient with pulse -->
  <svg class="glow-layer" id="glowLayer" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <defs>
      <radialGradient id="glowGrad" cx="0.4" cy="0.5" r="0.4">
        <stop offset="0%" stop-color="#d4a574" id="glowStop1"/>
        <stop offset="100%" stop-color="#d4a574" stop-opacity="0" id="glowStop2"/>
      </radialGradient>
    </defs>
    <rect width="100%" height="100%" fill="url(#glowGrad)">
      <animate attributeName="opacity" values="0.06;0.09;0.06" dur="4s" repeatCount="indefinite"/>
    </rect>
  </svg>

  <!-- Rule line: animated cubic bezier -->
  <svg class="rule-layer" id="ruleLayer" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="none" viewBox="0 0 1920 1080">
    <path id="rulePath" stroke="#8faa6b" stroke-opacity="0.35" stroke-width="1.5" fill="none">
      <animate attributeName="d" dur="6s" repeatCount="indefinite" id="ruleAnim"/>
    </path>
  </svg>

  <!-- Text -->
  <div class="content">
    <div class="section-label" id="sectionLabel"></div>
    <div class="title" id="titleText"></div>
    <div class="subtitle" id="subtitleText"></div>
  </div>
</div>

<script>
(function() {
  // Parse URL params
  const params = new URLSearchParams(window.location.search);
  const section  = params.get('section')  || 'SECTION';
  const title    = params.get('title')    || 'Title';
  const subtitle = params.get('subtitle') || '';
  const progress = parseFloat(params.get('progress') || '0.5');

  // Set text
  document.getElementById('sectionLabel').textContent = section;
  document.getElementById('titleText').textContent = title;
  const subEl = document.getElementById('subtitleText');
  if (subtitle) {
    subEl.textContent = subtitle;
  } else {
    subEl.style.display = 'none';
  }

  // ── Noise opacity: 0.04 * (1 - progress) ──
  const noiseOpacity = 0.04 * (1 - progress);
  const noiseLayer = document.getElementById('noiseLayer');
  if (noiseOpacity < 0.005) {
    noiseLayer.style.display = 'none';
  } else {
    noiseLayer.style.opacity = noiseOpacity;
  }

  // ── Glow color: amber if progress < 0.5, green if >= 0.5 ──
  const glowColor = progress < 0.5 ? '#d4a574' : '#8faa6b';
  const baseGlowOpacity = 0.06;
  const glowLo = Math.max(0, baseGlowOpacity - 0.03);
  const glowHi = baseGlowOpacity + 0.03;

  document.getElementById('glowStop1').setAttribute('stop-color', glowColor);
  document.getElementById('glowStop2').setAttribute('stop-color', glowColor);

  // Position glow based on progress
  const cx = (600 + progress * 200) / 1920;
  const cy = (540 + Math.sin(progress * Math.PI) * 80) / 1080;
  const glowGrad = document.getElementById('glowGrad');
  glowGrad.setAttribute('cx', cx.toFixed(3));
  glowGrad.setAttribute('cy', cy.toFixed(3));
  glowGrad.setAttribute('r', (500 / 1920).toFixed(3));

  // Glow pulse animation values
  const glowRect = document.querySelector('#glowLayer rect');
  const animEl = glowRect.querySelector('animate');
  animEl.setAttribute('values', `${glowLo};${glowHi};${glowLo}`);

  // ── Rule line: y=92%, amplitude = (1 - progress) * 12% ──
  const lineY = 1080 * 0.92;
  const amplitude = (1 - progress) * (1080 * 0.12);
  const cp1y = lineY - amplitude;
  const cp2y = lineY + amplitude;

  // Animate between two slightly different bezier states
  const amp2 = amplitude * 0.7;
  const cp1y2 = lineY - amp2;
  const cp2y2 = lineY + amp2;

  const d1 = `M 0 ${lineY} C 633 ${cp1y} 1267 ${cp2y} 1920 ${lineY}`;
  const d2 = `M 0 ${lineY} C 633 ${cp2y2} 1267 ${cp1y2} 1920 ${lineY}`;
  const ruleAnim = document.getElementById('ruleAnim');
  ruleAnim.setAttribute('values', `${d1};${d2};${d1}`);

  // Set initial path
  document.getElementById('rulePath').setAttribute('d', d1);
})();
</script>
</body>
</html>
