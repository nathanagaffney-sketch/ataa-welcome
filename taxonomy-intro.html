<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exhibit Taxonomy — What Can Be Reliably Made with AI</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }

  .container {
    position: relative;
    width: 100vw;
    height: 56.25vw; /* 16:9 */
    max-height: 100vh;
    max-width: 177.78vh;
  }

  .slide-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
  }

  /* ── Canvases ── */
  #particles {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  #energy {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
  }

  /* ── Shimmer sweeps ── */
  .shimmer-overlay {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    background: linear-gradient(
      110deg,
      transparent 0%, transparent 35%,
      rgba(143, 170, 107, 0.06) 42%,
      rgba(143, 170, 107, 0.10) 50%,
      rgba(143, 170, 107, 0.06) 58%,
      transparent 65%, transparent 100%
    );
    background-size: 300% 100%;
    animation: shimmerSweep 8s ease-in-out infinite;
  }

  .shimmer-overlay-2 {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    background: linear-gradient(
      250deg,
      transparent 0%, transparent 30%,
      rgba(212, 165, 116, 0.04) 45%,
      rgba(212, 165, 116, 0.08) 50%,
      rgba(212, 165, 116, 0.04) 55%,
      transparent 70%, transparent 100%
    );
    background-size: 350% 100%;
    animation: shimmerSweep2 11s ease-in-out infinite 3s;
  }

  .shimmer-overlay-3 {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    background: linear-gradient(
      200deg,
      transparent 0%, transparent 30%,
      rgba(176, 96, 96, 0.04) 42%,
      rgba(176, 96, 96, 0.07) 50%,
      rgba(176, 96, 96, 0.04) 58%,
      transparent 70%, transparent 100%
    );
    background-size: 100% 300%;
    animation: shimmerVertical 14s ease-in-out infinite 5s;
  }

  @keyframes shimmerSweep {
    0%   { background-position: 200% 0; }
    100% { background-position: -100% 0; }
  }
  @keyframes shimmerSweep2 {
    0%   { background-position: -100% 0; }
    100% { background-position: 250% 0; }
  }
  @keyframes shimmerVertical {
    0%   { background-position: 0 200%; }
    100% { background-position: 0 -100%; }
  }

  /* ── Zone glows — pulse over each spotlight area ── */
  .zone-glow-green {
    position: absolute;
    top: 25%;
    left: 2%;
    width: 30%;
    height: 65%;
    z-index: 5;
    pointer-events: none;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(143, 170, 107, 0.10) 0%, transparent 70%);
    animation: zonePulse 5s ease-in-out infinite;
  }

  .zone-glow-amber {
    position: absolute;
    top: 22%;
    left: 35%;
    width: 30%;
    height: 65%;
    z-index: 5;
    pointer-events: none;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(212, 165, 116, 0.10) 0%, transparent 70%);
    animation: zonePulse 5.5s ease-in-out infinite 1.8s;
  }

  .zone-glow-red {
    position: absolute;
    top: 25%;
    right: 2%;
    width: 30%;
    height: 65%;
    z-index: 5;
    pointer-events: none;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(176, 96, 96, 0.10) 0%, transparent 70%);
    animation: zonePulse 4.5s ease-in-out infinite 3.5s;
  }

  @keyframes zonePulse {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50%      { opacity: 1; transform: scale(1.06); }
  }

  /* ── Volumetric beam flicker — three vertical beams ── */
  .beam-flicker-green {
    position: absolute;
    top: 0;
    left: 8%;
    width: 18%;
    height: 100%;
    z-index: 5;
    pointer-events: none;
    background: linear-gradient(180deg,
      rgba(143, 170, 107, 0.06) 0%,
      rgba(143, 170, 107, 0.03) 40%,
      transparent 80%
    );
    animation: beamFlicker 3s ease-in-out infinite;
  }

  .beam-flicker-amber {
    position: absolute;
    top: 0;
    left: 40%;
    width: 20%;
    height: 100%;
    z-index: 5;
    pointer-events: none;
    background: linear-gradient(180deg,
      rgba(212, 165, 116, 0.06) 0%,
      rgba(212, 165, 116, 0.03) 40%,
      transparent 80%
    );
    animation: beamFlicker 3.5s ease-in-out infinite 1s;
  }

  .beam-flicker-red {
    position: absolute;
    top: 0;
    right: 8%;
    width: 18%;
    height: 100%;
    z-index: 5;
    pointer-events: none;
    background: linear-gradient(180deg,
      rgba(176, 96, 96, 0.06) 0%,
      rgba(176, 96, 96, 0.03) 40%,
      transparent 80%
    );
    animation: beamFlicker 2.8s ease-in-out infinite 2s;
  }

  @keyframes beamFlicker {
    0%, 100% { opacity: 0.4; }
    25%      { opacity: 0.9; }
    50%      { opacity: 0.5; }
    75%      { opacity: 1.0; }
  }

  /* ── Title glow ── */
  .title-glow {
    position: absolute;
    top: 0;
    left: 15%;
    width: 70%;
    height: 18%;
    z-index: 5;
    pointer-events: none;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(240, 236, 226, 0.04) 0%, transparent 70%);
    animation: titleGlowPulse 6s ease-in-out infinite;
  }

  @keyframes titleGlowPulse {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 1.0; }
  }

  /* ── Vignette ── */
  .vignette {
    position: absolute;
    inset: 0;
    z-index: 8;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(5, 5, 10, 0.50) 100%);
  }
</style>
</head>
<body>

<div class="container">
  <img class="slide-bg" src="https://nathanagaffney-sketch.github.io/ataa-welcome/taxonomy-beacons.png" alt="Exhibit Taxonomy">

  <canvas id="particles"></canvas>
  <canvas id="energy"></canvas>

  <div class="shimmer-overlay"></div>
  <div class="shimmer-overlay-2"></div>
  <div class="shimmer-overlay-3"></div>

  <div class="zone-glow-green"></div>
  <div class="zone-glow-amber"></div>
  <div class="zone-glow-red"></div>

  <div class="beam-flicker-green"></div>
  <div class="beam-flicker-amber"></div>
  <div class="beam-flicker-red"></div>

  <div class="title-glow"></div>

  <div class="vignette"></div>
</div>

<script>
(() => {
  const pCanvas = document.getElementById('particles');
  const pCtx = pCanvas.getContext('2d');
  const eCanvas = document.getElementById('energy');
  const eCtx = eCanvas.getContext('2d');

  let W, H;

  function resize() {
    const rect = pCanvas.parentElement.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    for (const c of [pCanvas, eCanvas]) {
      c.width = W * devicePixelRatio;
      c.height = H * devicePixelRatio;
      c.style.width = W + 'px';
      c.style.height = H + 'px';
      c.getContext('2d').setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }
  }

  window.addEventListener('resize', resize);
  resize();

  // ── PARTICLES — color-coded motes weighted by zone position ──
  const PARTICLE_COUNT = 90;
  const particles = [];

  // Zone centers (x as fraction of width)
  const ZONES = [
    { cx: 0.17, color: [143, 170, 107], weight: 3 },  // green
    { cx: 0.50, color: [212, 165, 116], weight: 3 },  // amber
    { cx: 0.83, color: [176, 96, 96],   weight: 2 },  // red
  ];

  function createParticle(init) {
    // Pick a zone (weighted)
    const totalW = ZONES.reduce((s, z) => s + z.weight, 0);
    let r = Math.random() * totalW;
    let zone = ZONES[0];
    for (const z of ZONES) { r -= z.weight; if (r <= 0) { zone = z; break; } }

    // Scatter around zone center
    const spread = 0.15;
    const x = (zone.cx + (Math.random() - 0.5) * spread) * W;
    const isBig = Math.random() < 0.10;

    return {
      x: init ? (zone.cx + (Math.random() - 0.5) * spread) * W : x,
      y: init ? Math.random() * H : H * 0.9 + Math.random() * H * 0.1,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -(0.08 + Math.random() * 0.25),
      r: isBig ? (2.5 + Math.random() * 2.5) : (0.6 + Math.random() * 1.8),
      opacity: isBig ? (0.25 + Math.random() * 0.25) : (0.10 + Math.random() * 0.22),
      color: zone.color,
      life: init ? Math.random() * 400 : 0,
      maxLife: 300 + Math.random() * 500,
      twinkleSpeed: 0.015 + Math.random() * 0.03,
      twinklePhase: Math.random() * Math.PI * 2,
      isBig,
    };
  }

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push(createParticle(true));
  }

  function drawParticle(p, time) {
    let alpha = p.opacity;
    const fadeIn = 55, fadeOut = 75;
    if (p.life < fadeIn) alpha *= p.life / fadeIn;
    if (p.life > p.maxLife - fadeOut) alpha *= (p.maxLife - p.life) / fadeOut;
    alpha *= 0.7 + 0.3 * Math.sin(time * p.twinkleSpeed + p.twinklePhase);
    if (alpha <= 0.01) return;

    const [cr, cg, cb] = p.color;

    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    pCtx.fillStyle = `rgba(${cr}, ${cg}, ${cb}, ${alpha})`;
    pCtx.fill();

    // Halo
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.r * 2.8, 0, Math.PI * 2);
    pCtx.fillStyle = `rgba(${cr}, ${cg}, ${cb}, ${alpha * 0.15})`;
    pCtx.fill();

    if (p.isBig) {
      pCtx.beginPath();
      pCtx.arc(p.x, p.y, p.r * 5, 0, Math.PI * 2);
      pCtx.fillStyle = `rgba(${cr}, ${cg}, ${cb}, ${alpha * 0.05})`;
      pCtx.fill();
    }
  }

  // ── ENERGY STREAMS — connecting the three zones ──
  let energyTime = 0;

  const anchors = [
    { x: 0.17, y: 0.55 },  // green zone center
    { x: 0.50, y: 0.55 },  // amber zone center
    { x: 0.83, y: 0.55 },  // red zone center
    { x: 0.50, y: 0.12 },  // title nexus
    { x: 0.17, y: 0.10 },  // green beam top
    { x: 0.83, y: 0.10 },  // red beam top
  ];

  const connections = [
    [0, 1], [1, 2], [0, 2],  // zones to each other
    [0, 3], [1, 3], [2, 3],  // zones to title
    [3, 4], [3, 5],          // title to beam tops
  ];

  const connColors = [
    [143, 170, 107],  // green-amber
    [212, 165, 116],  // amber-red
    [176, 96, 96],    // green-red
    [143, 170, 107],  // green-title
    [212, 165, 116],  // amber-title
    [176, 96, 96],    // red-title
    [143, 170, 107],  // title-greenTop
    [176, 96, 96],    // title-redTop
  ];

  function drawEnergyStreams(time) {
    eCtx.clearRect(0, 0, W, H);
    energyTime += 0.003;

    for (let ci = 0; ci < connections.length; ci++) {
      const [a, b] = connections[ci];
      const ax = anchors[a].x * W;
      const ay = anchors[a].y * H;
      const bx = anchors[b].x * W;
      const by = anchors[b].y * H;
      const col = connColors[ci];

      const thickness = 0.4 + 1.0 * (0.5 + 0.5 * Math.sin(energyTime * 2.2 + ci * 0.8));
      const baseAlpha = 0.025 + 0.025 * Math.sin(energyTime * 1.8 + ci * 1.1);

      const mx = (ax + bx) / 2 + Math.sin(energyTime * 1.4 + a) * W * 0.02;
      const my = (ay + by) / 2 + Math.cos(energyTime * 1.1 + b) * H * 0.02;

      eCtx.beginPath();
      eCtx.moveTo(ax, ay);
      eCtx.quadraticCurveTo(mx, my, bx, by);
      eCtx.strokeStyle = `rgba(${col[0]}, ${col[1]}, ${col[2]}, ${baseAlpha})`;
      eCtx.lineWidth = thickness;
      eCtx.stroke();

      // Traveling light dot
      const t = (Math.sin(energyTime * 1.3 + ci * 1.5) + 1) / 2;
      const dotX = (1 - t) * (1 - t) * ax + 2 * (1 - t) * t * mx + t * t * bx;
      const dotY = (1 - t) * (1 - t) * ay + 2 * (1 - t) * t * my + t * t * by;
      const dotAlpha = baseAlpha * 4;

      eCtx.beginPath();
      eCtx.arc(dotX, dotY, 2, 0, Math.PI * 2);
      eCtx.fillStyle = `rgba(${col[0]}, ${col[1]}, ${col[2]}, ${dotAlpha})`;
      eCtx.fill();

      eCtx.beginPath();
      eCtx.arc(dotX, dotY, 7, 0, Math.PI * 2);
      eCtx.fillStyle = `rgba(${col[0]}, ${col[1]}, ${col[2]}, ${dotAlpha * 0.25})`;
      eCtx.fill();
    }
  }

  // ── ANIMATION LOOP ──
  let frameCount = 0;

  function animate() {
    frameCount++;
    pCtx.clearRect(0, 0, W, H);

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life++;
      p.vx += (Math.random() - 0.5) * 0.012;
      p.vx = Math.max(-0.5, Math.min(0.5, p.vx));

      drawParticle(p, frameCount);

      if (p.life >= p.maxLife || p.y < -25 || p.x < -25 || p.x > W + 25) {
        particles[i] = createParticle(false);
      }
    }

    drawEnergyStreams(frameCount);
    requestAnimationFrame(animate);
  }

  animate();
})();
</script>

</body>
</html>
