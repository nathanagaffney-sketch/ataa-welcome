<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exhibit Taxonomy — What Can Be Reliably Made with AI</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }

  .container {
    position: relative;
    width: 100vw;
    height: 56.25vw; /* 16:9 */
    max-height: 100vh;
    max-width: 177.78vh;
  }

  .slide-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
  }

  #particles {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  /* Shimmer sweeps — Emergence palette */
  .shimmer-overlay {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: linear-gradient(
      110deg,
      transparent 0%,
      transparent 35%,
      rgba(143, 170, 107, 0.05) 42%,
      rgba(143, 170, 107, 0.10) 50%,
      rgba(143, 170, 107, 0.05) 58%,
      transparent 65%,
      transparent 100%
    );
    background-size: 300% 100%;
    animation: shimmerSweep 8s ease-in-out infinite;
  }

  .shimmer-overlay-2 {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: linear-gradient(
      250deg,
      transparent 0%,
      transparent 30%,
      rgba(212, 165, 116, 0.04) 45%,
      rgba(212, 165, 116, 0.08) 50%,
      rgba(212, 165, 116, 0.04) 55%,
      transparent 70%,
      transparent 100%
    );
    background-size: 350% 100%;
    animation: shimmerSweep2 11s ease-in-out infinite 3s;
  }

  @keyframes shimmerSweep {
    0%   { background-position: 200% 0; }
    100% { background-position: -100% 0; }
  }

  @keyframes shimmerSweep2 {
    0%   { background-position: -100% 0; }
    100% { background-position: 250% 0; }
  }

  /* Zone glows — green, amber, red pulsing asynchronously */
  .zone-glow-green {
    position: absolute;
    top: 30%;
    left: 8%;
    width: 28%;
    height: 50%;
    z-index: 4;
    pointer-events: none;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(143, 170, 107, 0.10) 0%, transparent 70%);
    animation: zonePulse 4.5s ease-in-out infinite;
  }

  .zone-glow-amber {
    position: absolute;
    top: 28%;
    left: 36%;
    width: 28%;
    height: 50%;
    z-index: 4;
    pointer-events: none;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(212, 165, 116, 0.10) 0%, transparent 70%);
    animation: zonePulse 5.2s ease-in-out infinite 1.5s;
  }

  .zone-glow-red {
    position: absolute;
    top: 30%;
    right: 8%;
    width: 28%;
    height: 50%;
    z-index: 4;
    pointer-events: none;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(176, 96, 96, 0.10) 0%, transparent 70%);
    animation: zonePulse 4.0s ease-in-out infinite 3.0s;
  }

  @keyframes zonePulse {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50%      { opacity: 1; transform: scale(1.06); }
  }

  /* Vignette */
  .vignette {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(10, 10, 20, 0.55) 100%);
  }
</style>
</head>
<body>

<div class="container">
  <img class="slide-bg" src="https://nathanagaffney-sketch.github.io/ataa-welcome/taxonomy-desk.png" alt="Exhibit Taxonomy">

  <canvas id="particles"></canvas>

  <div class="shimmer-overlay"></div>
  <div class="shimmer-overlay-2"></div>

  <div class="zone-glow-green"></div>
  <div class="zone-glow-amber"></div>
  <div class="zone-glow-red"></div>

  <div class="vignette"></div>
</div>

<script>
(() => {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');

  let W, H;

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width = W * devicePixelRatio;
    canvas.height = H * devicePixelRatio;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }

  window.addEventListener('resize', resize);
  resize();

  // Floating dust motes — warm museum atmosphere
  const PARTICLE_COUNT = 40;
  const particles = [];

  // Palette: warm gold, green tinge, soft white
  const PALETTE = [
    { h: 38, s: 65, l: 72 },   // warm gold
    { h: 90, s: 35, l: 65 },   // muted green
    { h: 20, s: 50, l: 75 },   // warm white
    { h: 0,  s: 55, l: 65 },   // muted red
  ];

  function createParticle(init) {
    const pal = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    return {
      x: Math.random() * W,
      y: init ? Math.random() * H : H + 10,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -(0.08 + Math.random() * 0.25),
      r: 0.6 + Math.random() * 1.8,
      opacity: 0.08 + Math.random() * 0.18,
      hue: pal.h + (Math.random() - 0.5) * 10,
      sat: pal.s,
      lightness: pal.l,
      life: init ? Math.random() * 400 : 0,
      maxLife: 350 + Math.random() * 500,
      twinkleSpeed: 0.015 + Math.random() * 0.03,
      twinklePhase: Math.random() * Math.PI * 2,
    };
  }

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push(createParticle(true));
  }

  let frameCount = 0;

  function animate() {
    frameCount++;
    ctx.clearRect(0, 0, W, H);

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life++;
      p.vx += (Math.random() - 0.5) * 0.01;
      p.vx = Math.max(-0.4, Math.min(0.4, p.vx));

      let alpha = p.opacity;
      const fadeIn = 60, fadeOut = 80;
      if (p.life < fadeIn) alpha *= p.life / fadeIn;
      if (p.life > p.maxLife - fadeOut) alpha *= (p.maxLife - p.life) / fadeOut;
      alpha *= 0.7 + 0.3 * Math.sin(frameCount * p.twinkleSpeed + p.twinklePhase);

      if (alpha > 0.01) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${p.hue}, ${p.sat}%, ${p.lightness}%, ${alpha})`;
        ctx.fill();

        // Soft glow
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${p.hue}, ${p.sat}%, ${p.lightness}%, ${alpha * 0.12})`;
        ctx.fill();
      }

      if (p.life >= p.maxLife || p.y < -20 || p.x < -20 || p.x > W + 20) {
        particles[i] = createParticle(false);
      }
    }

    requestAnimationFrame(animate);
  }

  animate();
})();
</script>

</body>
</html>
